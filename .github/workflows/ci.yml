name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFCL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run smoke test
        run: .\build\Release\fcl_hello.exe

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
